<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SRT EN → JP</title>
  <style>
    :root { --bg:#f5f7fb; --ink:#182235; --muted:#6d7788; --line:#dfe5ef; --card:#fff; --navy:#172a4d; --blue:#316be8; --green:#18845a; --red:#c74444; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background:linear-gradient(145deg,#edf2ff 0,#f6f8fc 42%,#edf7f5 100%); }
    header { padding:24px max(24px,calc((100vw - 1140px)/2)); display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; letter-spacing:-.3px; }
    .mark { width:36px; height:36px; display:grid; place-items:center; color:white; background:var(--blue); border-radius:11px; box-shadow:0 8px 18px #316be844; font-size:18px; }
    .badge { color:#315181; background:#e8efff; padding:6px 10px; border-radius:99px; font-size:12px; font-weight:700; }
    main { max-width:1140px; padding:10px 24px 72px; margin:auto; }
    .steps { display:flex; justify-content:center; gap:0; margin:12px auto 26px; color:var(--muted); font-size:13px; }
    .step { display:flex; align-items:center; gap:8px; }
    .step:not(:last-child)::after { content:""; width:55px; height:1px; margin:0 15px; background:#cfd7e5; }
    .num { display:grid; place-items:center; width:23px; height:23px; color:#fff; font-size:12px; font-weight:800; background:#8090ab; border-radius:50%; }
    .step.active { color:var(--blue); font-weight:700; }.step.active .num { background:var(--blue); }
    .card { background:var(--card); border:1px solid #e4e9f1; border-radius:20px; box-shadow:0 18px 44px #15284c0d; overflow:hidden; }
    .upload { min-height:200px; padding:30px; display:grid; place-items:center; border:2px dashed #b9c8e6; border-radius:15px; margin:20px; cursor:pointer; transition:.18s; background:#fbfcff; text-align:center; }
    .upload:hover,.upload.drag { border-color:var(--blue); background:#f4f7ff; }.upload-icon { font-size:35px; margin-bottom:8px; }.upload strong { font-size:17px; }.upload p { font-size:13px; color:var(--muted); margin:7px 0 0; }
    input[type=file] { display:none; }
    .filebar { display:none; align-items:center; gap:12px; padding:14px 20px; margin:0 20px 20px; border:1px solid var(--line); border-radius:12px; background:#f9fbff; }.filebar.show { display:flex; }
    .fileicon { font-size:25px; }.filemeta { min-width:0; flex:1; }.filename { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-weight:700; font-size:14px; }.fileinfo { margin-top:3px; color:var(--muted); font-size:12px; }
    button { font:inherit; cursor:pointer; border:0; border-radius:10px; font-weight:750; transition:.18s; }.remove { padding:7px 10px; color:#65718a; background:transparent; }.remove:hover { color:var(--red); background:#fff0f0; }
    .actions { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; padding:18px 22px; border-top:1px solid var(--line); }
    .notice { font-size:12px; line-height:1.5; color:var(--muted); }
    .controls { display:flex; align-items:center; gap:12px; margin-left:auto; }
    .engine { display:flex; align-items:center; gap:8px; }
    .engine label { font-size:12px; color:var(--muted); font-weight:700; }
    .engine select { padding:9px 12px; border:1px solid var(--line); border-radius:9px; background:white; font:inherit; font-size:13px; font-weight:600; color:var(--ink); outline:none; }
    .engine select:focus { border-color:var(--blue); }
    .primary { padding:12px 20px; background:var(--blue); color:#fff; box-shadow:0 6px 13px #316be83c; white-space:nowrap; }
    .primary:disabled { cursor:not-allowed; opacity:.48; box-shadow:none; }
    .primary:not(:disabled):hover { transform:translateY(-1px); background:#245bd5; }
    #work { display:none; margin-top:24px; }
    .workspace { display:grid; grid-template-columns:1fr 1fr; gap:0; }
    .pane { min-width:0; }
    .pane:first-child { border-right:1px solid var(--line); }
    .pane-head { padding:15px 20px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .pane h2 { margin:0; font-size:15px; }
    .tag { color:#50617d; background:#edf1f7; border-radius:99px; padding:4px 8px; font-size:11px; font-weight:700; }
    .tag.jp { color:#087051; background:#e3f7ef; }
    textarea { display:block; width:100%; height:370px; resize:vertical; padding:17px 20px; border:0; outline:0; color:#26324a; background:#fcfdff; font:13px/1.68 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre; }
    .jp-area { background:#fbfefc; }
    .status { min-height:58px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 20px; border-top:1px solid var(--line); }
    .status-left { display:flex; flex-direction:column; gap:4px; }
    .status-message { font-size:13px; color:var(--muted); }
    .status-message.ok { color:var(--green); font-weight:700; }
    .status-message.error { color:var(--red); font-weight:700; }
    .token-usage { font-size:12px; color:#4a5b78; font-weight:600; display:none; }
    .token-usage.show { display:inline-block; }
    .download { display:none; padding:11px 16px; color:#fff; background:var(--green); white-space:nowrap; }
    .download.show { display:block; }
    .download:hover { background:#116f4b; }
    .integrity { display:none; margin-top:16px; padding:15px 17px; border:1px solid #bde7d4; border-radius:13px; color:#166648; background:#f0fbf6; font-size:13px; line-height:1.55; }
    .integrity.show { display:block; }
    .integrity b { display:block; margin-bottom:3px; }
    .footer-info { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:18px; padding:0 4px; font-size:12px; color:var(--muted); }
    .quota a { color:var(--blue); text-decoration:none; font-weight:600; }
    .quota a:hover { text-decoration:underline; }
    .hint { margin:18px auto 0; max-width:860px; font-size:12px; line-height:1.65; color:var(--muted); text-align:center; }
    @media (max-width:768px) {
      header { padding:20px 18px; }
      main { padding:8px 16px 45px; }
      .steps { font-size:11px; }
      .step:not(:last-child)::after { width:18px; margin:0 7px; }
      .workspace { grid-template-columns:1fr; }
      .pane:first-child { border-right:0; border-bottom:1px solid var(--line); }
      textarea { height:260px; }
      .actions { align-items:stretch; flex-direction:column; }
      .controls { flex-direction:column; align-items:stretch; margin-left:0; }
      .primary { width:100%; }
      .status { align-items:flex-start; flex-direction:column; }
      .download { width:100%; }
      .footer-info { flex-direction:column; align-items:flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="mark">字幕</div>
      <span>SRT EN → JP</span>
    </div>
    <span class="badge">Gemini 構造保護モード</span>
  </header>
  <main>
    <div class="steps">
      <div class="step active"><span class="num">1</span>ファイルを選択</div>
      <div class="step"><span class="num">2</span>翻訳・確認</div>
      <div class="step"><span class="num">3</span>ダウンロード</div>
    </div>
    <section class="card" id="uploadCard">
      <label class="upload" id="dropZone" for="fileInput">
        <div>
          <div class="upload-icon">⇧</div>
          <strong>.srt ファイルをここへドロップ</strong>
          <p>またはクリックしてファイルを選択</p>
        </div>
      </label>
      <input id="fileInput" type="file" accept=".srt,text/plain" />
      <div class="filebar" id="fileBar">
        <span class="fileicon">▤</span>
        <div class="filemeta">
          <div class="filename" id="fileName"></div>
          <div class="fileinfo" id="fileInfo"></div>
        </div>
        <button class="remove" id="removeFile" type="button">取り消す</button>
      </div>
      <div class="actions">
        <span class="notice">翻訳は安全なサーバー経由でGemini APIへ送信されます。<br>字幕データの取り扱いにご注意ください。</span>
        <div class="controls">
          <div class="engine">
            <label for="modelSelect">翻訳モデル:</label>
            <select id="modelSelect">
              <option value="gemini-3.5-flash-lite" selected>Gemini 3.5 Flash-Lite (標準)</option>
              <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
              <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
              <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash-Lite</option>
            </select>
          </div>
          <button class="primary" id="translateBtn" type="button" disabled>AIで日本語に翻訳する →</button>
        </div>
      </div>
    </section>
    <section id="work" class="card">
      <div class="workspace">
        <div class="pane">
          <div class="pane-head">
            <h2>オリジナル</h2>
            <span class="tag">変更不可</span>
          </div>
          <textarea id="sourceText" readonly spellcheck="false"></textarea>
        </div>
        <div class="pane">
          <div class="pane-head">
            <h2>日本語字幕</h2>
            <span class="tag jp">編集できます</span>
          </div>
          <textarea id="translatedText" class="jp-area" spellcheck="false" placeholder="翻訳結果がここに表示されます"></textarea>
        </div>
      </div>
      <div class="status">
        <div class="status-left">
          <span id="statusMessage" class="status-message">ファイルを選択すると、ここで処理状況を表示します。</span>
          <span id="tokenUsage" class="token-usage"></span>
        </div>
        <button class="download" id="downloadBtn" type="button">.srt をダウンロード</button>
      </div>
    </section>
    <div class="integrity" id="integrity"></div>
    <div class="footer-info">
      <div class="quota" id="quotaInfo">API無料枠の残量確認: <a href="https://aistudio.google.com/usage" target="_blank" rel="noreferrer">Google AI Studio (Usage) ↗</a></div>
    </div>
    <p class="hint">Gemini AIは前後の台詞を考慮して、自然な会話調・呼称統一・短く簡潔な映像字幕に翻訳します。出力前に、行数・空行位置・字幕番号・タイムコードがオリジナルと一致するかを必ず検査します。</p>
  </main>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      const fileInput = el('fileInput'), dropZone = el('dropZone'), fileBar = el('fileBar'), fileName = el('fileName'), fileInfo = el('fileInfo');
      const translateBtn = el('translateBtn'), modelSelect = el('modelSelect'), work = el('work'), sourceText = el('sourceText'), translatedText = el('translatedText');
      const status = el('statusMessage'), tokenUsage = el('tokenUsage'), integrity = el('integrity'), downloadBtn = el('downloadBtn');
      let original = '', fileBaseName = 'translated.srt', newline = '\n';
      let totalUsage = { prompt: 0, candidates: 0, total: 0 };
      const timecode = /^\s*\d{1,2}:\d{2}:\d{2}[,.]\d{3}\s*-->\s*\d{1,2}:\d{2}:\d{2}[,.]\d{3}(?:\s+.*)?\s*$/;
      const cueNumber = /^\s*\d+\s*$/;

      const setStatus = (message, kind='') => {
        status.textContent = message;
        status.className = `status-message ${kind}`;
      };

      const updateTokenDisplay = () => {
        if (totalUsage.total > 0) {
          tokenUsage.textContent = `消費推定トークン数: ${totalUsage.total.toLocaleString()} tokens (入力: ${totalUsage.prompt.toLocaleString()} / 出力: ${totalUsage.candidates.toLocaleString()})`;
          tokenUsage.classList.add('show');
        } else {
          tokenUsage.classList.remove('show');
        }
      };

      const splitLines = text => text.split(/\r\n|\n|\r/);

      function subtitleLineIndexes(text) {
        const lines = splitLines(text);
        const indexes = [];
        let hasTimecode = false;
        for (let i = 0; i < lines.length; i++) {
          if (timecode.test(lines[i])) {
            hasTimecode = true;
            continue;
          }
          if (!hasTimecode || !lines[i].trim() || cueNumber.test(lines[i])) continue;
          indexes.push(i);
        }
        return indexes;
      }

      function validate(candidate) {
        const a = splitLines(original), b = splitLines(candidate);
        if (a.length !== b.length) return { ok: false, reason: `行数が一致しません（元: ${a.length} 行 / 出力: ${b.length} 行）` };
        const permitted = new Set(subtitleLineIndexes(original));
        for (let i = 0; i < a.length; i++) {
          if (!permitted.has(i) && a[i] !== b[i]) return { ok: false, reason: `${i + 1}行目の字幕テキスト以外の内容が変更されています。` };
        }
        return { ok: true, reason: `検証済み：${a.length}行、タイムコード・字幕番号・空行位置はオリジナルと完全一致しています。` };
      }

      function showValidation() {
        if (!original) return false;
        const result = validate(translatedText.value);
        integrity.classList.add('show');
        integrity.innerHTML = result.ok
          ? `<b>✓ 構造の整合性を確認しました</b>${result.reason}`
          : `<b>⚠ 出力できません</b>${result.reason}`;
        integrity.style.borderColor = result.ok ? '#bde7d4' : '#f2c5c5';
        integrity.style.background = result.ok ? '#f0fbf6' : '#fff6f6';
        integrity.style.color = result.ok ? '#166648' : '#a13434';
        downloadBtn.classList.toggle('show', result.ok && !!translatedText.value);
        return result.ok;
      }

      function loadFile(file) {
        if (!file) return;
        if (!/\.srt$/i.test(file.name)) {
          setStatus('SRT形式のファイルを選択してください。', 'error');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          original = String(reader.result).replace(/^\uFEFF/, '');
          newline = original.includes('\r\n') ? '\r\n' : '\n';
          fileBaseName = file.name.replace(/\.srt$/i, '') + '_ja.srt';
          sourceText.value = original;
          translatedText.value = '';
          totalUsage = { prompt: 0, candidates: 0, total: 0 };
          updateTokenDisplay();
          fileName.textContent = file.name;
          fileInfo.textContent = `${(file.size / 1024).toFixed(1)} KB ・ ${splitLines(original).length} 行`;
          fileBar.classList.add('show');
          translateBtn.disabled = false;
          work.style.display = 'block';
          integrity.classList.remove('show');
          downloadBtn.classList.remove('show');
          setStatus('準備完了。翻訳を開始できます。');
        };
        reader.readAsText(file, 'utf-8');
      }

      const BATCH_SIZE = 40;
      const MIN_REQUEST_INTERVAL_MS = 6200; // RPM <= 10 (1分間最大約9.6リクエスト) を確実に維持
      let lastRequestStartTime = 0;

      async function translateBatch(items, model) {
        let lastError = 'AI翻訳サービスに接続できませんでした。';
        for (let attempt = 1; attempt <= 3; attempt++) {
          try {
            const response = await fetch('/api/translate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ items, model })
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              const msg = data.error || `サーバーエラー（HTTP ${response.status}）`;
              if (response.status === 429 || /quota|rate limit/i.test(msg)) {
                // レート制限の場合は長めに待機
                if (attempt < 3) {
                  setStatus(`APIレート制限に到達しました。安全のため ${attempt * 10} 秒待機して再試行します…`, 'error');
                  await new Promise(resolve => setTimeout(resolve, attempt * 10000));
                  continue;
                }
              }
              throw new Error(msg);
            }
            if (!Array.isArray(data.translations) || data.translations.length === 0) {
              throw new Error('AIの応答に有効な翻訳行が含まれていませんでした。');
            }

            const received = new Map();
            for (const item of data.translations) {
              if (item && Number.isInteger(item.line) && typeof item.text === 'string') {
                received.set(item.line, item.text);
              }
            }

            if (data.usage) {
              totalUsage.prompt += (data.usage.promptTokenCount || 0);
              totalUsage.candidates += (data.usage.candidatesTokenCount || 0);
              totalUsage.total += (data.usage.totalTokenCount || 0);
              updateTokenDisplay();
            }

            return received;
          } catch (error) {
            lastError = error.message || lastError;
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, attempt * 2000));
          }
        }
        throw new Error(lastError);
      }

      async function runTranslation() {
        const lines = splitLines(original);
        const targets = subtitleLineIndexes(original);
        if (!targets.length) {
          setStatus('翻訳対象の英文字幕行を検出できませんでした。', 'error');
          return;
        }

        translateBtn.disabled = true;
        modelSelect.disabled = true;
        downloadBtn.classList.remove('show');
        integrity.classList.remove('show');
        totalUsage = { prompt: 0, candidates: 0, total: 0 };
        updateTokenDisplay();

        const selectedModel = modelSelect.value;
        const translatable = targets.filter(i => /[A-Za-z]/.test(lines[i])).map(i => ({ line: i, text: lines[i] }));
        const batches = [];
        for (let i = 0; i < translatable.length; i += BATCH_SIZE) {
          batches.push(translatable.slice(i, i + BATCH_SIZE));
        }

        let completed = 0;
        let failedCount = 0;
        const MAX_FAILED_LINES = 100;
        let isAborted = false;
        const errors = [];
        lastRequestStartTime = 0;

        setStatus(`Geminiが文脈を考慮して翻訳しています… 0 / ${translatable.length} 行`);

        for (let i = 0; i < batches.length; i++) {
          const currentBatch = batches[i];

          // RPM <= 10 を維持するためのリクエスト間隔制御
          const now = Date.now();
          const elapsed = now - lastRequestStartTime;
          if (lastRequestStartTime > 0 && elapsed < MIN_REQUEST_INTERVAL_MS) {
            const waitMs = MIN_REQUEST_INTERVAL_MS - elapsed;
            const waitSec = (waitMs / 1000).toFixed(1);
            setStatus(`Gemini APIレート制限（RPM ≤ 10）を遵守中… 次のリクエストまで待機中 (${waitSec}秒)`);
            await new Promise(resolve => setTimeout(resolve, waitMs));
          }
          lastRequestStartTime = Date.now();

          setStatus(`Geminiが文脈を考慮して翻訳中… (${completed + 1}〜${Math.min(completed + currentBatch.length, translatable.length)} / ${translatable.length} 行)`);

          try {
            const results = await translateBatch(currentBatch, selectedModel);
            for (const item of currentBatch) {
              if (results.has(item.line)) {
                lines[item.line] = results.get(item.line);
              } else {
                failedCount++;
              }
            }
          } catch (error) {
            failedCount += currentBatch.length;
            errors.push(`${currentBatch[0].line + 1}〜${currentBatch.at(-1).line + 1}行目: ${error.message}`);
          }

          if (failedCount > MAX_FAILED_LINES) {
            isAborted = true;
            break;
          }

          completed += currentBatch.length;
          setStatus(`Geminiが文脈を考慮して翻訳中… ${completed} / ${translatable.length} 行${failedCount > 0 ? ` (未翻訳: ${failedCount} 行)` : ''}`);
        }

        translatedText.value = lines.join(newline);

        // --- 後処理（取りこぼし・英文残存行の自動回収・再翻訳フェーズ） ---
        if (!isAborted) {
          const missedItems = translatable.filter(item => {
            const cur = lines[item.line];
            return cur === item.text || /[A-Za-z]{2,}/.test(cur);
          });

          if (missedItems.length > 0 && missedItems.length <= MAX_FAILED_LINES) {
            setStatus(`未翻訳・英文が残った ${missedItems.length} 行を自動回収・再翻訳しています…`);
            const retryBatches = [];
            for (let i = 0; i < missedItems.length; i += 20) {
              retryBatches.push(missedItems.slice(i, i + 20));
            }

            for (let i = 0; i < retryBatches.length; i++) {
              const retryBatch = retryBatches[i];
              const now = Date.now();
              const elapsed = now - lastRequestStartTime;
              if (lastRequestStartTime > 0 && elapsed < MIN_REQUEST_INTERVAL_MS) {
                const waitMs = MIN_REQUEST_INTERVAL_MS - elapsed;
                setStatus(`未翻訳行の自動回収中… 次のリクエストまで待機中 (${(waitMs / 1000).toFixed(1)}秒)`);
                await new Promise(resolve => setTimeout(resolve, waitMs));
              }
              lastRequestStartTime = Date.now();

              setStatus(`未翻訳行を再翻訳中… (${i * 20 + 1}〜${Math.min((i + 1) * 20, missedItems.length)} / ${missedItems.length} 行)`);
              try {
                const results = await translateBatch(retryBatch, selectedModel);
                for (const item of retryBatch) {
                  if (results.has(item.line)) {
                    lines[item.line] = results.get(item.line);
                  }
                }
              } catch (e) {
                // 自動回収のリトライ失敗は許容
              }
            }
            translatedText.value = lines.join(newline);
          }
        }

        translateBtn.disabled = false;
        modelSelect.disabled = false;

        // 最終チェック
        const finalMissed = translatable.filter(item => {
          const cur = lines[item.line];
          return cur === item.text || /[A-Za-z]{2,}/.test(cur);
        });

        if (isAborted) {
          setStatus(`【処理中断】エラーにより未翻訳（原文のまま）となった行が100行を超えたため（未翻訳: ${failedCount} 行）、安全のため処理を停止しました。最新のエラー: ${errors.at(-1) || '通信エラー'}（該当行までは反映済みです）`, 'error');
        } else if (finalMissed.length > 0) {
          const sampleLines = finalMissed.slice(0, 5).map(x => `${x.line + 1}行目`).join('、');
          const more = finalMissed.length > 5 ? ' など' : '';
          setStatus(`${translatable.length} 行の翻訳を完了しました（英文残存: ${finalMissed.length}行 → ${sampleLines}${more}。右側の画面で直接手動修正できます）。`, 'ok');
        } else {
          setStatus(`${translatable.length} 行すべての翻訳・自動補正が完了しました。構造の整合性を検証しています…`, 'ok');
        }
        showValidation();
      }

      fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
      ['dragenter', 'dragover'].forEach(type => dropZone.addEventListener(type, e => {
        e.preventDefault();
        dropZone.classList.add('drag');
      }));
      ['dragleave', 'drop'].forEach(type => dropZone.addEventListener(type, e => {
        e.preventDefault();
        dropZone.classList.remove('drag');
      }));
      dropZone.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

      el('removeFile').addEventListener('click', () => {
        original = '';
        fileInput.value = '';
        fileBar.classList.remove('show');
        translateBtn.disabled = true;
        work.style.display = 'none';
        integrity.classList.remove('show');
        totalUsage = { prompt: 0, candidates: 0, total: 0 };
        updateTokenDisplay();
      });

      translateBtn.addEventListener('click', runTranslation);

      translatedText.addEventListener('input', () => {
        if (translatedText.value) {
          setStatus('編集内容を検証しました。');
          showValidation();
        }
      });

      downloadBtn.addEventListener('click', () => {
        if (!showValidation()) return;
        const blob = new Blob([translatedText.value], { type: 'application/x-subrip;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = fileBaseName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      });
    })();
  </script>
</body>
</html>
